name: Auto-Scrape & Update T-Shirts

on:
  schedule:
    # Runs everyday at 04:00 UTC (9:00 AM Pakistan Standard Time)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'scraper/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Scraper
        run: |
          python scraper/scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update t-shirts catalog [skip ci]" && git push)
